name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myerp
          POSTGRES_PASSWORD: myerp
          POSTGRES_DB: myerp_platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U myerp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PLATFORM_DATABASE_URL: postgres://myerp:myerp@localhost:5432/myerp_platform
      DJANGO_DEBUG: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false
      - run: terraform validate

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t myerp-app:ci .
      - name: Image starts and serves the React app
        run: |
          docker run -d --name app -p 8000:8000 \
            -e DJANGO_DEBUG=0 -e DJANGO_SECRET_KEY=ci -e DJANGO_SECURE_SSL_REDIRECT=0 \
            -e DJANGO_ALLOWED_HOSTS=localhost myerp-app:ci
          for i in $(seq 1 20); do curl -sf localhost:8000/ >/dev/null && break; sleep 1; done
          curl -sf localhost:8000/ | grep -q '<div id="root">'
          docker logs app
